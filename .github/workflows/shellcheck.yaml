---
name: ShellCheck

on:
  push:
    branches:
      - master
      - main
    paths:
      - '**/*.sh'
      - .github/workflows/shellcheck.yaml
  pull_request:
    branches:
      - master
      - main
    paths:
      - '**/*.sh'
      - .github/workflows/shellcheck.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shared Bash checks
    permissions:
      contents: read
    uses: hamedonassar95/Devobs/.github/workflows/reusable-bash-ci.yml@c9f1a81126aec17175f65b966cf954589691a0db
    with:
      working_directory: .
      shellcheck_severity: warning

  validate-shellcheck:
    name: ShellCheck
    if: always()
    needs: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require shared Bash checks to pass
        env:
          SHARED_RESULT: ${{ needs.shellcheck.result }}
        run: |
          set -euo pipefail
          if [[ "$SHARED_RESULT" != "success" ]]; then
            echo "::error::Shared Bash CI did not succeed: $SHARED_RESULT"
            exit 1
          fi
